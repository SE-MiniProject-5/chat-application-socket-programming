<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Application - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="logo">💬</div>
      <h2>Chat Application</h2>
      <p class="subtitle">SE Mini-Project · Socket Programming</p>
    </div>

    <div class="tabs">
      <button id="tab-register" class="tab-btn active" onclick="switchTab('register')">Register</button>
      <button id="tab-login" class="tab-btn" onclick="switchTab('login')">Log In</button>
    </div>

    <!-- Alert Message Box -->
    <div id="alert-box" class="alert hidden" role="alert"></div>

    <!-- Registration Form -->
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input 
          type="text" 
          id="reg-username" 
          placeholder="e.g. alex_01 (3-20 characters)" 
          required 
          autocomplete="off"
        >
        <small class="hint">Alphanumeric and underscores only, case-insensitive</small>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input 
          type="password" 
          id="reg-password" 
          placeholder="At least 8 characters" 
          required
        >
      </div>

      <button type="submit" id="reg-submit-btn" class="submit-btn">Create Account</button>
    </form>

    <!-- Login Form -->
    <form id="login-form" class="hidden" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="submit-btn">Log In</button>
    </form>

    <div class="footer">
      <small>Task <strong>FR-02</strong>: Duplicate Username Rejection</small>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
